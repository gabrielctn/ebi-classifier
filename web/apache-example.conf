# Example Apache 2.4 configuration for hosting the browser classifier.
# Needs mod_alias, mod_headers and mod_authz_core, inside an HTTPS virtual host.
# Adjust the URL path and the directory to your server.
#
# Deny by default: only the file types the page needs are served, read-only.

RedirectMatch 301 "^/EBI$" "/EBI/"
Alias /EBI /var/www/ebi-classifier

<Directory /var/www/ebi-classifier>
    Options None
    AllowOverride None
    DirectoryIndex index.html
    Require all denied
    <FilesMatch ".*">
        Require all denied
    </FilesMatch>
    # "^$" is a directory itself; /EBI/ is then served as index.html.
    <FilesMatch "^$|^[A-Za-z0-9][A-Za-z0-9._-]*\.(html|css|js|mjs|wasm|onnx|json|txt)$">
        # Read-only: any method other than GET or HEAD is refused.
        Require method GET HEAD
    </FilesMatch>

    AddType application/wasm .wasm
    AddType text/javascript .js .mjs
    AddType application/octet-stream .onnx

    # The page may load only its own files and may not contact another server.
    # index.html carries the same policy in a <meta> tag; the header adds
    # frame-ancestors, which a <meta> tag cannot set.
    Header always set Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    # Cross-origin isolation, which lets the browser run the model on several
    # CPU threads. Every resource of the page is same-origin.
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Cross-Origin-Embedder-Policy "require-corp"
    Header always set Cross-Origin-Resource-Policy "same-origin"
    Header always set Referrer-Policy "no-referrer"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Header always set X-Content-Type-Options "nosniff"
    Header set X-Frame-Options "DENY"

    # Always revalidate, so an updated model and its checksum in config.json
    # cannot get out of step in a browser cache.
    <FilesMatch "\.(css|js|mjs|wasm|onnx|json)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
</Directory>
